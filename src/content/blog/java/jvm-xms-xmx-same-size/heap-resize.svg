<svg width="1000" height="420" viewBox="0 0 1000 420" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1000" height="420" rx="24" fill="#F8FAFC"/>
  <text x="54" y="70" fill="#111827" font-family="Pretendard, Noto Sans KR, Arial, sans-serif" font-size="32" font-weight="800">-Xms &lt; -Xmx: 힙은 필요에 따라 커질 수 있다</text>
  <text x="56" y="110" fill="#526071" font-family="Pretendard, Noto Sans KR, Arial, sans-serif" font-size="20" font-weight="500">처음에는 일부만 committed 되고, GC와 할당 압력에 따라 최대 힙까지 확장된다.</text>

  <rect x="70" y="170" width="860" height="92" rx="18" fill="#FFFFFF" stroke="#CAD5E2" stroke-width="2"/>
  <rect x="70" y="170" width="250" height="92" rx="18" fill="#5BA7E5"/>
  <path d="M320 170H912C921.941 170 930 178.059 930 188V244C930 253.941 921.941 262 912 262H320V170Z" fill="#E8F3FF"/>
  <path d="M320 170V262" stroke="#2B6EA3" stroke-width="2" stroke-dasharray="7 7"/>
  <text x="112" y="224" fill="#FFFFFF" font-family="Pretendard, Noto Sans KR, Arial, sans-serif" font-size="24" font-weight="800">committed heap</text>
  <text x="495" y="224" fill="#1F4E79" font-family="Pretendard, Noto Sans KR, Arial, sans-serif" font-size="24" font-weight="800">reserved but not yet committed</text>

  <text x="72" y="306" fill="#1F4E79" font-family="Pretendard, Noto Sans KR, Arial, sans-serif" font-size="22" font-weight="800">-Xms 512m</text>
  <text x="790" y="306" fill="#1F4E79" font-family="Pretendard, Noto Sans KR, Arial, sans-serif" font-size="22" font-weight="800">-Xmx 2g</text>
  <path d="M332 302C410 344 538 348 636 303" stroke="#F4A261" stroke-width="5" stroke-linecap="round"/>
  <path d="M636 303L611 300L626 320L636 303Z" fill="#F4A261"/>
  <text x="386" y="374" fill="#7C3F11" font-family="Pretendard, Noto Sans KR, Arial, sans-serif" font-size="20" font-weight="700">GC 이후 여유 공간이 부족하면 확장 판단</text>
</svg>
