<svg width="1100" height="640" viewBox="0 0 1100 640" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1100" height="640" fill="#F8FAFC"/>
  <text x="64" y="78" fill="#111827" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="800">Class loading lifecycle</text>
  <text x="66" y="112" fill="#526070" font-family="Inter, Arial, sans-serif" font-size="17">Loading, linking, and initialization prepare a class for execution.</text>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2 2 L10 6 L2 10 Z" fill="#334155"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0F172A" flood-opacity="0.08"/>
    </filter>
  </defs>

  <g filter="url(#shadow)">
    <rect x="74" y="238" width="190" height="108" rx="18" fill="#EEF6FF" stroke="#93C5FD" stroke-width="2"/>
    <text x="169" y="284" text-anchor="middle" fill="#1E3A8A" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="800">Loading</text>
    <text x="169" y="314" text-anchor="middle" fill="#315B87" font-family="Inter, Arial, sans-serif" font-size="14">Find bytecode</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="344" y="176" width="410" height="232" rx="24" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
    <text x="549" y="220" text-anchor="middle" fill="#0F172A" font-family="Inter, Arial, sans-serif" font-size="25" font-weight="800">Linking</text>
    <rect x="382" y="250" width="100" height="84" rx="15" fill="#FEF3C7" stroke="#FCD34D"/>
    <text x="432" y="284" text-anchor="middle" fill="#92400E" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="800">Verify</text>
    <text x="432" y="309" text-anchor="middle" fill="#92400E" font-family="Inter, Arial, sans-serif" font-size="12">type safe</text>
    <rect x="499" y="250" width="100" height="84" rx="15" fill="#ECFDF5" stroke="#86EFAC"/>
    <text x="549" y="284" text-anchor="middle" fill="#166534" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="800">Prepare</text>
    <text x="549" y="309" text-anchor="middle" fill="#166534" font-family="Inter, Arial, sans-serif" font-size="12">static slots</text>
    <rect x="616" y="250" width="100" height="84" rx="15" fill="#F7F1FF" stroke="#C4B5FD"/>
    <text x="666" y="284" text-anchor="middle" fill="#5B21B6" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="800">Resolve</text>
    <text x="666" y="309" text-anchor="middle" fill="#5B21B6" font-family="Inter, Arial, sans-serif" font-size="12">references</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="834" y="238" width="190" height="108" rx="18" fill="#FFF7ED" stroke="#FDBA74" stroke-width="2"/>
    <text x="929" y="284" text-anchor="middle" fill="#9A3412" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="800">Initialization</text>
    <text x="929" y="314" text-anchor="middle" fill="#9A3412" font-family="Inter, Arial, sans-serif" font-size="14">&lt;clinit&gt; runs</text>
  </g>

  <line x1="266" y1="292" x2="336" y2="292" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="756" y1="292" x2="826" y2="292" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="484" y1="292" x2="491" y2="292" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="600" y1="292" x2="608" y2="292" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="120" y="486" width="860" height="70" rx="16" fill="#F1F5F9" stroke="#CBD5E1"/>
  <text x="550" y="516" text-anchor="middle" fill="#334155" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700">Key detail</text>
  <text x="550" y="542" text-anchor="middle" fill="#475569" font-family="Inter, Arial, sans-serif" font-size="14">Static fields get default values during preparation, then explicit values during initialization.</text>
</svg>
