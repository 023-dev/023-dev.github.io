<svg width="1100" height="640" viewBox="0 0 1100 640" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1100" height="640" fill="#F8FAFC"/>
  <text x="64" y="78" fill="#111827" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="800">Execution engine</text>
  <text x="66" y="112" fill="#526070" font-family="Inter, Arial, sans-serif" font-size="17">HotSpot starts quickly with interpretation, then compiles hot code into native code.</text>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2 2 L10 6 L2 10 Z" fill="#334155"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0F172A" flood-opacity="0.08"/>
    </filter>
  </defs>

  <g filter="url(#shadow)">
    <rect x="84" y="234" width="190" height="110" rx="18" fill="#EEF6FF" stroke="#93C5FD" stroke-width="2"/>
    <text x="179" y="278" text-anchor="middle" fill="#1E3A8A" font-family="Inter, Arial, sans-serif" font-size="23" font-weight="800">Bytecode</text>
    <text x="179" y="308" text-anchor="middle" fill="#315B87" font-family="Inter, Arial, sans-serif" font-size="14">loaded class methods</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="354" y="174" width="210" height="110" rx="18" fill="#FEF3C7" stroke="#FCD34D" stroke-width="2"/>
    <text x="459" y="218" text-anchor="middle" fill="#92400E" font-family="Inter, Arial, sans-serif" font-size="23" font-weight="800">Interpreter</text>
    <text x="459" y="248" text-anchor="middle" fill="#92400E" font-family="Inter, Arial, sans-serif" font-size="14">fast startup, profiling</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="354" y="354" width="210" height="110" rx="18" fill="#F7F1FF" stroke="#C4B5FD" stroke-width="2"/>
    <text x="459" y="398" text-anchor="middle" fill="#5B21B6" font-family="Inter, Arial, sans-serif" font-size="23" font-weight="800">JIT Compiler</text>
    <text x="459" y="428" text-anchor="middle" fill="#68518E" font-family="Inter, Arial, sans-serif" font-size="14">C1, C2, optimization</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="646" y="354" width="190" height="110" rx="18" fill="#ECFDF5" stroke="#86EFAC" stroke-width="2"/>
    <text x="741" y="398" text-anchor="middle" fill="#166534" font-family="Inter, Arial, sans-serif" font-size="23" font-weight="800">Code Cache</text>
    <text x="741" y="428" text-anchor="middle" fill="#306F50" font-family="Inter, Arial, sans-serif" font-size="14">compiled native code</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="914" y="234" width="122" height="110" rx="18" fill="#FFF7ED" stroke="#FDBA74" stroke-width="2"/>
    <text x="975" y="278" text-anchor="middle" fill="#9A3412" font-family="Inter, Arial, sans-serif" font-size="23" font-weight="800">CPU</text>
    <text x="975" y="308" text-anchor="middle" fill="#9A3412" font-family="Inter, Arial, sans-serif" font-size="14">executes</text>
  </g>

  <line x1="276" y1="289" x2="345" y2="238" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="276" y1="289" x2="345" y2="400" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="566" y1="409" x2="638" y2="409" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="838" y1="409" x2="922" y2="346" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="566" y1="229" x2="905" y2="282" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M650 354 C620 314 585 286 548 262" stroke="#94A3B8" stroke-width="2.5" fill="none" stroke-dasharray="8 8"/>
  <text x="630" y="318" fill="#64748B" font-family="Inter, Arial, sans-serif" font-size="14">hot code detected</text>
  <rect x="178" y="526" width="744" height="48" rx="12" fill="#F1F5F9" stroke="#CBD5E1"/>
  <text x="550" y="556" text-anchor="middle" fill="#475569" font-family="Inter, Arial, sans-serif" font-size="14">Garbage collectors run alongside execution to reclaim unreachable heap objects.</text>
</svg>
