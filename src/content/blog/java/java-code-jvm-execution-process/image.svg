<svg width="1200" height="675" viewBox="0 0 1200 675" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="675" fill="#F8FAFC"/>
  <rect x="64" y="64" width="1072" height="547" rx="28" fill="#FFFFFF" stroke="#D7DEE8" stroke-width="2"/>
  <text x="96" y="122" fill="#111827" font-family="Inter, Arial, sans-serif" font-size="38" font-weight="800">Java code execution flow</text>
  <text x="98" y="158" fill="#526070" font-family="Inter, Arial, sans-serif" font-size="18">From source code to optimized machine code inside the JVM</text>

  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2 2 L10 6 L2 10 Z" fill="#334155"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0F172A" flood-opacity="0.08"/>
    </filter>
  </defs>

  <g filter="url(#shadow)">
    <rect x="100" y="246" width="160" height="120" rx="18" fill="#EEF6FF" stroke="#93C5FD" stroke-width="2"/>
    <text x="180" y="297" text-anchor="middle" fill="#1E3A8A" font-family="Inter, Arial, sans-serif" font-size="25" font-weight="800">.java</text>
    <text x="180" y="326" text-anchor="middle" fill="#315B87" font-family="Inter, Arial, sans-serif" font-size="15">Source code</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="342" y="246" width="160" height="120" rx="18" fill="#F7F1FF" stroke="#C4B5FD" stroke-width="2"/>
    <text x="422" y="297" text-anchor="middle" fill="#5B21B6" font-family="Inter, Arial, sans-serif" font-size="25" font-weight="800">javac</text>
    <text x="422" y="326" text-anchor="middle" fill="#68518E" font-family="Inter, Arial, sans-serif" font-size="15">Compile</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="584" y="246" width="160" height="120" rx="18" fill="#ECFDF5" stroke="#86EFAC" stroke-width="2"/>
    <text x="664" y="297" text-anchor="middle" fill="#166534" font-family="Inter, Arial, sans-serif" font-size="25" font-weight="800">.class</text>
    <text x="664" y="326" text-anchor="middle" fill="#306F50" font-family="Inter, Arial, sans-serif" font-size="15">Bytecode</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="826" y="216" width="236" height="180" rx="22" fill="#FFF7ED" stroke="#FDBA74" stroke-width="2"/>
    <text x="944" y="260" text-anchor="middle" fill="#9A3412" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="800">JVM</text>
    <rect x="856" y="284" width="176" height="34" rx="10" fill="#FFFFFF" stroke="#FED7AA"/>
    <text x="944" y="307" text-anchor="middle" fill="#7C2D12" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700">Class Loader</text>
    <rect x="856" y="328" width="176" height="34" rx="10" fill="#FFFFFF" stroke="#FED7AA"/>
    <text x="944" y="351" text-anchor="middle" fill="#7C2D12" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700">Runtime Data Areas</text>
    <rect x="856" y="372" width="176" height="34" rx="10" fill="#FFFFFF" stroke="#FED7AA"/>
    <text x="944" y="395" text-anchor="middle" fill="#7C2D12" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700">Execution Engine</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="480" y="466" width="240" height="78" rx="18" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="2"/>
    <text x="600" y="498" text-anchor="middle" fill="#0F172A" font-family="Inter, Arial, sans-serif" font-size="21" font-weight="800">Native machine code</text>
    <text x="600" y="525" text-anchor="middle" fill="#475569" font-family="Inter, Arial, sans-serif" font-size="15">Interpreter or JIT compiler</text>
  </g>

  <line x1="262" y1="306" x2="334" y2="306" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="504" y1="306" x2="576" y2="306" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="746" y1="306" x2="818" y2="306" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M944 404 C944 476 760 504 730 505" stroke="#334155" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <path d="M470 505 C338 505 180 430 180 374" stroke="#94A3B8" stroke-width="2.5" fill="none" stroke-dasharray="8 8"/>
  <text x="290" y="512" fill="#64748B" font-family="Inter, Arial, sans-serif" font-size="14">platform independent bytecode, platform specific JVM</text>
</svg>
