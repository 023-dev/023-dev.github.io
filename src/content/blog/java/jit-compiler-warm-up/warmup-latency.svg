<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="520" viewBox="0 0 1100 520" role="img" aria-labelledby="title desc">
  <title id="title">Warm-up Latency</title>
  <desc id="desc">A chart showing initial high latency before warm-up and stable latency after warm-up.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
    <style>
      .heading { font: 800 32px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0f172a; letter-spacing: 0; }
      .label { font: 700 19px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #111827; letter-spacing: 0; }
      .small { font: 500 15px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #64748b; letter-spacing: 0; }
      .axis { stroke: #334155; stroke-width: 2.5; fill: none; marker-end: url(#arrow); }
      .grid { stroke: #e2e8f0; stroke-width: 1.5; }
    </style>
  </defs>
  <rect width="1100" height="520" fill="#ffffff"/>
  <text x="56" y="66" class="heading">Warm-up 전후의 응답 시간</text>
  <text x="56" y="96" class="small">첫 요청에 몰리던 준비 비용을 실제 트래픽 이전으로 이동한다.</text>

  <g transform="translate(100 135)">
    <line x1="0" y1="300" x2="900" y2="300" class="axis"/>
    <line x1="0" y1="300" x2="0" y2="12" class="axis"/>
    <line x1="0" y1="240" x2="870" y2="240" class="grid"/>
    <line x1="0" y1="180" x2="870" y2="180" class="grid"/>
    <line x1="0" y1="120" x2="870" y2="120" class="grid"/>
    <line x1="0" y1="60" x2="870" y2="60" class="grid"/>
    <text x="-46" y="26" class="small">latency</text>
    <text x="820" y="340" class="small">requests</text>

    <path d="M 32 50 C 65 70, 84 235, 126 250 C 205 278, 260 265, 328 270 C 430 276, 520 272, 620 274 C 720 276, 790 272, 850 274" fill="none" stroke="#ef4444" stroke-width="6" stroke-linecap="round"/>
    <circle cx="32" cy="50" r="8" fill="#ef4444"/>
    <text x="52" y="42" class="label" fill="#b91c1c">첫 요청 스파이크</text>

    <path d="M 32 268 C 135 270, 260 271, 380 270 C 530 268, 680 270, 850 269" fill="none" stroke="#16a34a" stroke-width="6" stroke-linecap="round"/>
    <text x="52" y="292" class="label" fill="#166534">Warm-up 후 안정 구간</text>

    <g transform="translate(530 48)">
      <rect width="292" height="92" rx="16" fill="#f8fafc" stroke="#e2e8f0"/>
      <text x="24" y="34" class="label">Warm-up이 앞당기는 일</text>
      <text x="24" y="61" class="small">class loading, lazy init, profiling</text>
      <text x="24" y="82" class="small">일부 JIT compilation</text>
    </g>
  </g>
</svg>
