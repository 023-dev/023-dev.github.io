<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="520" viewBox="0 0 1100 520" role="img" aria-labelledby="title desc">
  <title id="title">Java Execution Flow</title>
  <desc id="desc">The flow from Java source code to bytecode, class loading, interpreter and JIT compiled native code.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <style>
      .heading { font: 800 32px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0f172a; letter-spacing: 0; }
      .label { font: 700 22px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #111827; letter-spacing: 0; }
      .small { font: 500 15px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #64748b; letter-spacing: 0; }
      .mono { font: 700 16px "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace; fill: #334155; letter-spacing: 0; }
      .box { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; }
      .stage { fill: #f8fafc; stroke: #dbeafe; stroke-width: 2; }
      .arrow { stroke: #475569; stroke-width: 3; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="1100" height="520" fill="#ffffff"/>
  <text x="52" y="66" class="heading">Java 실행 흐름</text>
  <text x="52" y="96" class="small">소스 코드는 바이트코드가 되고, JVM은 실행 중에 인터프리팅과 JIT 컴파일을 함께 사용한다.</text>

  <g transform="translate(60 160)">
    <rect class="box" x="0" y="0" width="170" height="110" rx="14"/>
    <text x="85" y="45" text-anchor="middle" class="label">Source</text>
    <text x="85" y="76" text-anchor="middle" class="mono">Main.java</text>
  </g>
  <path class="arrow" d="M248 215 H330"/>
  <text x="289" y="196" text-anchor="middle" class="small">javac</text>

  <g transform="translate(350 160)">
    <rect class="box" x="0" y="0" width="170" height="110" rx="14"/>
    <text x="85" y="45" text-anchor="middle" class="label">Bytecode</text>
    <text x="85" y="76" text-anchor="middle" class="mono">Main.class</text>
  </g>
  <path class="arrow" d="M538 215 H620"/>
  <text x="579" y="196" text-anchor="middle" class="small">load / link / init</text>

  <g transform="translate(640 140)">
    <rect class="stage" x="0" y="0" width="380" height="150" rx="18"/>
    <text x="190" y="36" text-anchor="middle" class="label">JVM Execution Engine</text>
    <g transform="translate(38 68)">
      <rect x="0" y="0" width="130" height="54" rx="12" fill="#eff6ff" stroke="#bfdbfe"/>
      <text x="65" y="34" text-anchor="middle" class="small" fill="#1d4ed8">Interpreter</text>
    </g>
    <g transform="translate(212 68)">
      <rect x="0" y="0" width="130" height="54" rx="12" fill="#f0fdf4" stroke="#bbf7d0"/>
      <text x="65" y="34" text-anchor="middle" class="small" fill="#166534">JIT Compiler</text>
    </g>
  </g>

  <g transform="translate(180 350)">
    <rect x="0" y="0" width="740" height="86" rx="16" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="32" y="34" class="label">실행 중 만들어지는 것</text>
    <text x="32" y="63" class="small">프로파일링 정보, 컴파일 큐, Code Cache, 최적화된 네이티브 코드</text>
  </g>
</svg>
